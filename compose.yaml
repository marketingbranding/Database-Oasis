services:
  app:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
    volumes:
      - .:/app
      - vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: database_oasis
      POSTGRES_USER: database_oasis
      POSTGRES_PASSWORD: database_oasis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U database_oasis -d database_oasis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  vendor:
